<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#F2EBDD}</style></head><body><canvas id="c"></canvas>
<script type="module">
// Motor testi: engine/hikaye.js ve engine/mekan.js'in her ortak parçasının t'ye bağlı küçük gösterimi.
//   ?p=<parça>&t=<sn>[&s=0.5][&guide=1]   tek parça, tam kare (1080×1920); window.renderFrame(t) kareyi sıfırdan çizer
//   ?kagit=motor[&demo=a-b][&sutun=2][&k=0.44]   motor kâğıdı: her parça için 4 an
//   ?kagit=poz[&satir=a-b][&k=0.6]               poz kâğıdı: Hikmet, Defne, Necmi, Kerem × pozlar
//   ?serit=<parça>&t0=0.9&t1=1.9[&n=12][&k=0.3]  ardışık kare şeridi: "el, dokunduğu şeye değiyor mu?", dirsek atlıyor mu?
// Parçalar: kesme, yon, yuruyus, atlama, geri, sivi, alev, erime, buyume, isik, verme, tasima, pankart, sayma, kerem, etiket, bolum
// "bolum" tam bir bölüm iskeletidir (build + draw'ın en küçük hâli): yeni bölüm dosyası ondan başlanarak yazılabilir.
// Buradaki DEMO girişleri aynı zamanda kullanım örneğidir: bölüm dosyasında aynı çağrılar kullanılır.
import * as H from './hikaye.js';
import * as M from './mekan.js';
const { PAL, INK, LW, ease, seg, lerp, clamp01, kisi, oyna, POZ, IFADE } = H;
const q = new URLSearchParams(location.search);
for (const w of ['900', '800', '700', '500']) await document.fonts.load(`${w} 60px Rubik`, 'ÇĞİıŞşÖöÜü');
await document.fonts.ready;
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), K = H.kit(ctx);
const CAY = M.MEKAN.cayOcagi, KADRO = ['hikmet', 'defne', 'necmi', 'genc'], AD = { hikmet: 'Hikmet', defne: 'Defne', necmi: 'Necmi', genc: 'Kerem (genc)' };

// ——— örnek mekân (en küçük kalıp): pencereli oda. durum = { saat, gunes, ay } ———
M.mekanEkle('demoOda', {
  gen: [0, 1500], capa: { masa: [860, 1290], pencere: [390, 960], saat: [900, 800] }, kadraj: { genis: [0.96, 750, 1222], masa: [1.15, 760, 1150] },
  dongu: ['martı', 'saniye kolu'],
  arka(K, t, { isik, durum }) {
    M.oda(K, { x0: -400, x1: 1900, isik });
    M.pencere(K, 180, 700, 420, 520, { isik, t, gunes: durum.gunes, ay: durum.ay });
    M.duvarSaati(K, 900, 800, 70, durum.saat ?? 10.25, t);
  },
});

// ——— gösterimlerde kullanılan basit nesneler (bölüm nesneleri bölüm dosyasında yazılır; bunlar yalnız örnek) ———
function tepsi(K, [x, y], rot = 0, w = 230) { const { ctx } = K; ctx.save(); ctx.translate(x, y); ctx.rotate(rot); K.rect(-w / 2, -13, w, 28, PAL.mustard, LW, 14); K.rect(-w / 2 + 22, -24, w - 44, 13, '#E9C46A', LW * 0.6, 6); ctx.restore(); }
function koli(K, x, y, w = 150, h = 110) { K.rect(x - w / 2, y - h, w, h, '#C99A5B', LW, 6); K.rect(x - 20, y - h, 40, h * 0.3, '#EFE3C8', LW * 0.6); K.line(x - w / 2 + 14, y - 22, x - w / 2 + 60, y - 22, 6, '#8C6A3A'); }
function kupa(K, x, y, k = 1, col = PAL.coral) { const { ctx } = K; ctx.beginPath(); ctx.arc(x + 30 * k, y - 32 * k, 17 * k, -Math.PI / 2, Math.PI / 2); ctx.lineWidth = 15 * k; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 6 * k; ctx.strokeStyle = col; ctx.stroke(); K.rect(x - 30 * k, y - 66 * k, 60 * k, 66 * k, col, LW, 9 * k); }
function tabure(K, x, y, w = 200) { K.rect(x - w / 2 + 18, y + 20, 16, 1500 - y - 20, PAL.wood, LW, 5); K.rect(x + w / 2 - 34, y + 20, 16, 1500 - y - 20, PAL.wood, LW, 5); K.rect(x - w / 2, y, w, 26, PAL.woodTop, LW, 8); }
function bardak(K, x, y, w, h, o) {   // (x, y) taban ortası; içi sivi() ile dolar, cam çizgisi en son
  const { ctx } = K, yol = c => { c.moveTo(x - w / 2, y - h); c.lineTo(x + w / 2, y - h); c.lineTo(x + w * 0.4, y); c.lineTo(x - w * 0.4, y); c.closePath(); };
  ctx.beginPath(); yol(ctx); ctx.fillStyle = 'rgba(244,237,224,0.28)'; ctx.fill();
  H.sivi(K, yol, [x - w / 2, y - h, w, h], o);
  ctx.beginPath(); yol(ctx); K.fs(null, LW); K.line(x - w * 0.3, y - h * 0.82, x - w * 0.27, y - h * 0.3, 5, 'rgba(255,255,255,0.7)');
}
function surahi(K, x, y, rot, seviye, renk) {   // (x, y) ağzın ucu (dönme merkezi); gövde sola doğru
  const { ctx } = K, yol = c => { c.moveTo(-170, -10); c.lineTo(-14, -10); c.lineTo(0, 0); c.lineTo(-22, 26); c.lineTo(-30, 250); c.lineTo(-156, 250); c.closePath(); };
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.arc(-170, 110, 62, Math.PI * 0.5, Math.PI * 1.5); ctx.lineWidth = 26; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 12; ctx.strokeStyle = '#DCEBEA'; ctx.stroke();
  ctx.beginPath(); yol(ctx); ctx.fillStyle = 'rgba(244,237,224,0.3)'; ctx.fill();
  H.sivi(K, yol, [-170, -10, 170, 260], { seviye, renk, egim: rot });
  ctx.beginPath(); yol(ctx); K.fs(null, LW); ctx.restore();
}
const yaziAlt = (s, x, y, size = 30, col = '#5E584C', w = 500) => { ctx.font = `${w} ${size}px Rubik`; ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.fillText(s, x, y); };

// ═══════════════════════════ GÖSTERİMLER ═══════════════════════════
// Her biri: { ad, baslik, anlar: [[t, not]…], y0 (kırpmanın üst kenarı), kam(t) → { zoom, cx, cy }, dunya(K, t, B), ekran?(K, t, B) }
const DEMO = {};

// 1 · Sahne listesi + sert kesme + nesne taşıma: tepsi kesmenin iki yanında ekranda aynı yerde durur
DEMO.kesme = (() => {
  const tK = 1.5, pA = [1010, 1232], pB = [M.capa(CAY, 'tezgah')[0], M.capa(CAY, 'tezgah')[1] - 10];
  const a = { id: 'gunduz', t0: 0, cam: [[0, ...M.kadraj(CAY, 'genis')]], isik: 'gunduz' };
  const camK = H.sahneler([a]).cam(tK - 1 / 30);                                    // kesmeden önceki son karenin kamerası
  const film = H.sahneler([a, { id: 'gece', t0: tK, cam: [[tK, ...H.esle(camK, pA, pB, 1.08)], [tK + 0.5, ...M.kadraj(CAY, 'tezgah')]], isik: 'gece' }]);
  const fark = H.esFark(camK, pA, film.cam(tK), pB);
  return {
    baslik: `Sahne listesi · sert kesme · nesne taşıma (esle → ekran farkı ${fark.map(v => v.toFixed(1)).join(', ')} px)`,
    anlar: [[0.9, 'A: tepsi Defne’de'], [tK - 1 / 30, 'kesmeden önceki kare'], [tK, 'kesme karesi: tepsi aynı yerde'], [tK + 1.2, 'B: kamera tezgâha oturur']],
    kam: t => film.cam(t),
    dunya(K, t) {
      const sc = film.at(t), o = { isik: M.ISIK[sc.isik] };
      M.mekanCiz(K, CAY, 'arka', t, o);
      if (sc.id === 'gunduz') {
        oyna(K, t, null, 'hikmet', kisi('hikmet', { x: 600, expr: 'kizgin', head: { tilt: 4, look: [0.8, 0.2] }, ...POZ.rahat }));
        const d = oyna(K, t, null, 'defne', kisi('defne', { x: 1010, expr: 'saskin', head: { tilt: -4, look: [-0.3, 0.6] } }), { L: [[pA[0] - 96, pA[1]]], R: [[pA[0] + 96, pA[1]]] });
        tepsi(K, pA); d.tut('L'); d.tut('R');
      } else {
        tepsi(K, pB);
        oyna(K, t, null, 'necmi', kisi('necmi', { x: 1330, expr: 'korku', head: { tilt: 5, look: [-0.8, 0.3] }, ...POZ.rahat }));
      }
      M.mekanCiz(K, CAY, 'isik', t, o);
    },
  };
})();

// 2 · Yön eşleme: nesne sağdan çıkar, yeni sahneye soldan aynı hızla girer
DEMO.yon = (() => {
  const tK = 1.0, v = 1700, yari = 150;
  const film = H.sahneler([{ id: 'ic', t0: 0, cam: [[0, ...M.kadraj(CAY, 'genis')]] }, { id: 'dis', t0: tK, cam: [[tK, 1, 540, 1222]] }]);
  const cA = film.cam(tK - 1e-3), cB = film.cam(tK);
  const araba = (K, x) => { K.rect(x - yari, 1300, yari * 2, 120, PAL.metal, LW, 12); K.rect(x - yari + 20, 1180, yari * 2 - 40, 124, '#C99A5B', LW, 6); K.text(K.up('koli'), x, 1262, 50, INK, 900); for (const dx of [-90, 90]) K.circ(x + dx, 1456, 40, '#3A3F3C', LW); for (const dx of [-90, 90]) K.circ(x + dx, 1456, 12, PAL.metal, 0); };
  return {
    baslik: `Yön eşleme (vektör kuralı): sağdan çıkar → soldan girer, ${v} px/sn`,
    anlar: [[tK - 0.3, 'A: sağa gidiyor'], [tK - 1 / 30, 'kesmeden önceki kare'], [tK + 1 / 30, 'kesmeden sonraki kare'], [tK + 0.3, 'B: aynı hızla sürüyor']],
    kam: t => film.cam(t),
    dunya(K, t) {
      if (film.at(t).id === 'ic') { M.mekanCiz(K, CAY, 'arka', t); araba(K, H.cikis(cA, t, tK, v, yari)); }
      else { M.acikHava(K, { x0: -800, x1: 2000, zemin: 'kaldirim', t }); araba(K, H.giris(cB, t, tK, v, yari)); }
    },
  };
})();

// 3 · Kesmesiz yürüyüş geçişi: yan yana iki mekân, kamera yürüyeni izler, bölmenin arkasından geçilir
DEMO.yuruyus = (() => {
  const D = M.yanYana([[CAY], ['demoOda']]), W = { t0: 0.4, x0: 1320, x1: D.D[1].ox + 760, hiz: 430 }, t1 = W.t0 + (W.x1 - W.x0) / W.hiz;
  return {
    baslik: 'Kesmesiz yürüyüş geçişi: yanYana + yuru + kamera takibi (kamKaris)',
    anlar: [[0.2, 'çıkmadan önce (önden)'], [1.15, 'yürüyor, kamera izliyor'], [W.t0 + (D.gecit(0) - W.x0) / W.hiz + 0.06, 'bölmenin arkasından geçiyor'], [t1 + 0.4, 'vardı (önden)']],
    kam(t) { const p = H.yuru('defne', t, W); return H.kamKaris({ zoom: 1, cx: W.x0 + 60, cy: 1222 }, { cx: p.x + 60 }, 1); },
    dunya(K, t) {
      D.ciz(K, 'arka', t);
      const yur = t >= W.t0 && t < t1, p = yur ? H.yuru('defne', t, W) : kisi('defne', { x: t < W.t0 ? W.x0 : W.x1, expr: 'notr', head: { tilt: 3, look: [t < W.t0 ? 0.7 : -0.5, 0] } });
      const kart = [p.x + (yur ? 62 : 86), yur ? 1262 : 1250];   // elindeki kart: yürürken yakın elde
      const d = oyna(K, t, null, 'defne', p, { R: [kart] });
      K.rect(kart[0] - 46, kart[1] - 62, 92, 62, PAL.mustard, LW, 8); d.tut('R');
      D.ciz(K, 'on', t);
    },
  };
})();

// 4 · Zaman atlaması: aynı kadraj; tek u saat ibresini, ışığı, ay-güneş yayını ve mumların erimesini sürer
DEMO.atlama = {
  baslik: 'Zaman atlaması (2,2 sn, kadraj sabit): atlama → saatSar → isikSaat → mum',
  anlar: [[0.3, 'u = 0 · 19:30'], [1.1, 'gece, mumlar kısalıyor'], [1.75, 'şafak'], [2.7, 'u = 1 · 07:30']],
  kam: () => ({ zoom: 1.08, cx: 700, cy: 1100 }),
  dunya(K, t) {
    const u = H.atlama(t, 0.4, 2.2), saat = H.saatSar(19.5, 31.5, u), g = M.isikSaat(saat);
    M.mekanCiz(K, 'demoOda', 'arka', t, { isik: g.isik, durum: { saat, gunes: g.gunes, ay: g.ay } });
    H.karart(K, g.isik.k);
    K.rect(600, 1290, 620, 40, PAL.woodTop, LW, 8); K.rect(630, 1330, 560, 170, PAL.wood);
    [720, 850, 980, 1110].forEach((x, i) => H.mum(K, x, 1290, 2.3, { h: i === 3 ? 1 : 1 - u, on: i !== 3 && u < 0.97, t, i, guc: i === 3 ? 0 : 1 - 0.5 * seg(u, 0.85, 0.12) }));
  },
  ekran(K, t) { H.zamanHapi(K, t, 0.5, 2.4, 'SABAHA KADAR', { x: 330, y: 1250, saat: H.saatSar(19.5, 31.5, H.atlama(t, 0.4, 2.2)) }); },
};

// 5 · Geri dönüş: saat rozeti 0,4 sn geri sarar → sert kesme → zaman hapı; gece ışığı, buzdolabı şeridi, siluet
DEMO.geri = (() => {
  const tK = 1.2, film = H.sahneler([{ id: 'simdi', t0: 0, cam: [[0, ...M.kadraj(CAY, 'genis')]] }, { id: 'dun', t0: tK, cam: [[tK, 1.1, 560, 1190]], kay: [-70, 0] }]);
  return {
    baslik: 'Geri dönüş: geriDonus + saatRozet → kesme → zamanHapi; mekân gece, lekele ile siluet',
    anlar: [[tK - 0.2, 'rozet geri sarıyor'], [tK + 0.26, 'kesmeden 8 kare sonra hap'], [tK + 0.8, 'kapak açılıyor'], [tK + 1.6, 'ışık şeridi + siluet']],
    kam: t => film.cam(t),
    dunya(K, t) {
      const g = H.geriDonus(t, tK), dolap = ease.state(seg(t, tK + 0.5, 0.5)), o = { isik: g.icinde ? M.ISIK.gece : M.ISIK.gunduz, durum: { dolap: g.icinde ? dolap : 0, saat: H.saatSar(10.25, 8.25, g.icinde ? 0 : g.sar) } };
      M.mekanCiz(K, CAY, 'arka', t, o);
      if (!g.icinde) {
        oyna(K, t, null, 'hikmet', kisi('hikmet', { x: 700, expr: 'kizgin', head: { tilt: -4, look: [0.6, -0.4] }, ...POZ.rahat }));
        oyna(K, t, null, 'necmi', kisi('necmi', { x: 1180, expr: 'korku', head: { tilt: 5, look: [-0.7, -0.3] }, ...POZ.rahat }));
      }
      M.mekanCiz(K, CAY, 'isik', t, o);
      if (g.icinde) H.lekele(K, K2 => oyna(K2, t, null, 'necmi', kisi('necmi', { x: 640, expr: 'mutlu', head: { tilt: -6, look: [-0.8, 0] } }), { sessiz: true, L: [M.capa(CAY, 'dolapRaf'), dolap] }), '#0C1D1F', 1);
    },
    ekran(K, t) { H.saatRozet(K, t, tK, { x: 560, y: 1180 }); H.zamanHapi(K, t, tK + 0.2, tK + 2.4, 'DÜN GECE', { y: 600, saat: 23.2 }); },
  };
})();

// 6 · Sıvı: seviye, eğim, akış, renk bulutu
DEMO.sivi = {
  baslik: 'Sıvı: sivi (seviye, eğim, bulut) + akis',
  anlar: [[0.75, 'sürahi eğilir, akış başlar'], [1.5, 'seviye yükselir'], [2.75, 'bulut yayılır (u ≈ 0,4)'], [3.9, 'renk karıştı']],
  kam: () => ({ zoom: 1.1, cx: 560, cy: 1120 }),
  dunya(K, t) {
    M.oda(K, { x0: -300, x1: 1500 });
    K.rect(200, 1320, 760, 40, PAL.woodTop, LW, 8); K.rect(230, 1360, 700, 140, PAL.wood);
    const dok = ease.state(seg(t, 0.2, 0.5)) - ease.state(seg(t, 1.7, 0.45)), dolu = ease.state(seg(t, 0.75, 1.05)), ak0 = seg(t, 1.72, 0.2), ak1 = seg(t, 0.55, 0.22);
    const bx = 640, by = 1320, agiz = [lerp(430, bx - 30, dok), lerp(1070, 940, dok)];   // sürahi masada durur, dökerken bardağın üstüne gelir
    if (ak1 > 0 && ak0 < 1) H.akis(K, agiz, [bx - 4, by - 300 * dolu * 0.82 - 6], 15, '#E8D27A', ak0, ak1);
    bardak(K, bx, by, 210, 300, { seviye: 0.06 + 0.76 * dolu, renk: '#E8D27A', bulut: { renk: '#7FA05A', u: seg(t, 2.2, 1.5), p: [0.5, 0.3], tohum: 5 } });
    if (t >= 2.05 && t < 3.6) H.eriyen(K, bx, by - 300 * 0.82 * 0.55, 62, 62, seg(t, 2.2, 1.3), { gol: false });   // eriyen buz bulutun kaynağı
    surahi(K, agiz[0], agiz[1], 1.25 * dok, 0.62 - 0.3 * dolu, '#E8D27A');
    bardak(K, 880, by, 150, 210, { seviye: 0.55, renk: '#CFE3DD' });
  },
};

// 7 · Alev ve duman: titreme, rüzgârda yatma, sönme + duman teli; buhar ve puf döngüleri
DEMO.alev = {
  baslik: 'Alev ve duman: alev / mum (yat, guc) · duman (sönme) · buhar · puf (döngü)',
  anlar: [[0.3, 'yanıyor'], [0.86, 'rüzgâr: alevler yatar'], [1.25, 'ikisi söndü: duman teli'], [1.9, 'duman dağılır; döngüler sürer']],
  kam: () => ({ zoom: 1.1, cx: 560, cy: 1120 }),
  dunya(K, t) {
    M.oda(K, { x0: -300, x1: 1500 });
    K.rect(140, 1320, 820, 40, PAL.woodTop, LW, 8); K.rect(170, 1360, 760, 140, PAL.wood);
    const yat = Math.sin(Math.PI * seg(t, 0.6, 0.5)), son = 1.0;
    [240, 350, 460, 570].forEach((x, i) => { const soner = i === 1 || i === 2; H.mum(K, x, 1320, 2.6, { on: !soner || t < son, t, i, yat: -yat, duman: soner ? son : null }); });
    kupa(K, 730, 1320, 1.5, PAL.teal); H.buhar(K, 730, 1205, t, { k: 1.3 });
    K.rect(840, 1262, 100, 34, '#5D6A61', LW, 10); H.puf(K, 946, 1278, t, { k: 1.1, yon: -0.25 });
  },
};

// 8 · Erime: mum (boy → göl) ve eriyen blok (buz)
DEMO.erime = {
  baslik: 'Erime: mum({ h }) + eriyen() — tek u ile boy kısalır, göl büyür',
  anlar: [[0.1, 'u = 0'], [0.9, 'u ≈ 0,35'], [1.5, 'u ≈ 0,7'], [2.3, 'u = 1']],
  kam: () => ({ zoom: 1.1, cx: 560, cy: 1120 }),
  dunya(K, t) {
    M.oda(K, { x0: -300, x1: 1500 });
    K.rect(140, 1320, 820, 40, PAL.woodTop, LW, 8); K.rect(170, 1360, 760, 140, PAL.wood);
    const u = H.atlama(t, 0.2, 2.0);
    [250, 370, 490].forEach((x, i) => H.mum(K, x, 1318, 3, { h: i === 1 ? 1 : 1 - u, on: i !== 1 && u < 0.97, t, i }));
    H.eriyen(K, 760, 1318, 170, 170, u);
  },
};

// 9 · Büyüme: yapraklar sırayla açılır, meyve büyür (tek u); güneş yayı
DEMO.buyume = {
  baslik: 'Büyüme: buyume(u, i, n) + yaprak; açık hava iskeleti, güneş yayı',
  anlar: [[0.1, 'u = 0'], [0.9, 'u ≈ 0,35'], [1.5, 'u ≈ 0,7'], [2.3, 'u = 1']],
  kam: () => ({ zoom: 1.0, cx: 540, cy: 870 }),
  dunya(K, t) {
    const u = H.atlama(t, 0.2, 2.0), { ctx } = K;
    M.acikHava(K, { x0: -400, x1: 1600, zemin: 'cim', gunes: (0.3 + u * 2.25) % 1, t });
    ctx.save(); ctx.lineCap = 'round'; for (const [lw, c] of [[40, INK], [26, '#7A5232']]) { ctx.beginPath(); ctx.moveTo(40, 760); ctx.quadraticCurveTo(480, 700, 940, 840); ctx.lineWidth = lw; ctx.strokeStyle = c; ctx.stroke(); } ctx.restore();
    const dal = v => [40 + 2 * (1 - v) * v * 440 * 2 + v * v * 900, (1 - v) * (1 - v) * 760 + 2 * (1 - v) * v * 700 + v * v * 840];
    for (let i = 0; i < 9; i++) { const p = dal(0.12 + i * 0.1); H.yaprak(K, p[0], p[1] - 8, 120, (i % 2 ? 0.7 : -0.6) + 0.04 * Math.sin(t * 1.6 + i), i % 2 ? PAL.green : '#4C8240', H.buyume(u, i, 9)); }
    const m = dal(0.62), r = lerp(14, 112, ease.state(u));
    K.line(m[0], m[1], m[0], m[1] + 70, 9, '#7A5232'); K.ell(m[0], m[1] + 70 + r, r * 0.82, r, '#C9C05A', LW);
  },
};

// 10 · Işık şeridi ve karanlık: gece mekânı, açılan kapıdan düşen düz renkli şerit, lekele ile karartılmış karakter
DEMO.isik = {
  baslik: 'Işık şeridi: karart + isikSeridi + zeminIsigi; çapa durumla taşınır (kapı kolu); lekele(a)',

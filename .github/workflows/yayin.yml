name: Bilmece Mesaisi planlayıcı

# Her çalıştırma önümüzdeki 48 saatin boş yuvalarını doldurur (Buffer customScheduled + dueAt).
# GitHub cron saatlerce gecikebilir ya da hiç çalışmayabilir; bu yüzden günde 4 deneme var ve
# her biri 2 günlük kuyruğu tamamlar. CI render etmez: videolar prebuilt/ klasöründen gelir.
on:
  schedule:
    - cron: '13 0 * * *'
    - cron: '13 6 * * *'
    - cron: '43 11 * * *'
    - cron: '13 17 * * *'
    # yayından ~20 dk sonra durum kontrolü: düşen gönderi hemen yeniden kurulur (12:30 ve 21:00 TR)
    - cron: '52 9 * * *'
    - cron: '22 18 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Sadece planla (medya/Buffer yok)'
        required: false
        default: false
        type: boolean

concurrency:
  group: bilmece
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Yuvaları doldur
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BILMECE_PAUSED: ${{ vars.BILMECE_PAUSED }}
          TZ: Europe/Istanbul
          INPUT_DRY: ${{ github.event.inputs.dry }}
        run: |
          git config user.name "bilmece-bot"
          git config user.email "bilmece-bot@users.noreply.github.com"
          if [ "$INPUT_DRY" = "true" ]; then node tools/yayin.mjs --dry; else node tools/yayin.mjs; fi

      - name: Durum defterini kaydet
        if: always()
        run: |
          git add state/ledger.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "durum: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          fi
